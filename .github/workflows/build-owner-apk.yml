name: Build Owner Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases (owner-latest)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - 'owner-mobile/**'
      - '.github/workflows/build-owner-apk.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-owner-apk:
    name: Build and Sign Owner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'owner-mobile/package-lock.json'

      - name: Install Dependencies
        working-directory: owner-mobile
        run: npm install --legacy-peer-deps

      - name: Verify TypeScript Build
        working-directory: owner-mobile
        run: npm run typecheck

      - name: Expo Prebuild (Generate Native Android)
        working-directory: owner-mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android NDK
        run: |
          echo "Verifying Android NDK installation..."
          if [ ! -d "$ANDROID_HOME/ndk/27.1.12297006" ]; then
            echo "Installing NDK 27.1.12297006 via sdkmanager..."
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"
          fi
          echo "NDK ready at: $ANDROID_HOME/ndk/27.1.12297006"

      - name: Compile Android Release APK
        working-directory: owner-mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: Sign APK with Persistent Keystore
        working-directory: owner-mobile
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build tools at: $BUILD_TOOLS_DIR"
          
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"
          
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW_APK" aligned-owner-app.apk
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks credentials/release.keystore \
            --ks-pass pass:narendrakirana123 \
            --ks-key-alias narendrakirana \
            --key-pass pass:narendrakirana123 \
            --out narendra-kirana-owner.apk \
            aligned-owner-app.apk
            
          $BUILD_TOOLS_DIR/apksigner verify -v narendra-kirana-owner.apk
          
          echo "Signed APK created successfully: $(ls -lh narendra-kirana-owner.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: narendra-kirana-owner-apk
          path: owner-mobile/narendra-kirana-owner.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases (owner-latest)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-latest
          name: Narendra Kirana Owner App (Latest APK)
          body: |
            ## Narendra Kirana Store Owner App - Official APK
            
            This is the latest production build of the Narendra Kirana Store / Owner Android mobile app.
            
            - Package: com.narendrakirana.owner
            - Direct Download: [narendra-kirana-owner.apk](https://github.com/${{ github.repository }}/releases/download/owner-latest/narendra-kirana-owner.apk)
            - Release Target: Store Owner & Staff Management
            
            ### How to Install:
            1. Download `narendra-kirana-owner.apk` to your phone.
            2. Tap the downloaded file and choose Install.
            3. If prompted, tap Settings and toggle Allow from this source.
          files: owner-mobile/narendra-kirana-owner.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
