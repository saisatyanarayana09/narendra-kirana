name: Publish Over-The-Air (OTA) Update

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update Branch (e.g. production, preview)'
        required: true
        default: 'production'
      message:
        description: 'Update commit / release notes'
        required: true
        default: 'Silent OTA update'

jobs:
  publish-ota:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Publish OTA Update to EAS
        working-directory: mobile
        run: |
          npx eas-cli update --branch ${{ inputs.branch }} --message "${{ inputs.message }}" --non-interactive
