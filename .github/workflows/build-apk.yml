name: Build Customer Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases (latest)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and Sign Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Install Dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild (Generate Native Android)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android Release APK
        working-directory: mobile/android
        env:
          ENTRY_FILE: index.js
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: Sign APK with Persistent Keystore
        working-directory: mobile
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build tools at: $BUILD_TOOLS_DIR"
          
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"
          
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW_APK" aligned-app.apk
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks credentials/release.keystore \
            --ks-pass pass:narendrakirana123 \
            --ks-key-alias narendrakirana \
            --key-pass pass:narendrakirana123 \
            --out narendra-kirana.apk \
            aligned-app.apk
            
          $BUILD_TOOLS_DIR/apksigner verify -v narendra-kirana.apk
          
          echo "Signed APK created successfully: $(ls -lh narendra-kirana.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: narendra-kirana-apk
          path: mobile/narendra-kirana.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases (latest)
        if: github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Narendra Kirana Customer App (Latest APK)
          body: |
            ## Narendra Kirana Mobile App - Official APK
            
            This is the latest production build of the Narendra Kirana Android mobile app.
            
            - Package: com.narendrakirana.app
            - Direct Download: [narendra-kirana.apk](https://github.com/${{ github.repository }}/releases/latest/download/narendra-kirana.apk)
            - In-App Updater Compatible: Yes (signed with permanent keystore)
            
            ### How to Install:
            1. Download narendra-kirana.apk to your phone.
            2. Tap the downloaded file and choose Install.
            3. If prompted, tap Settings and toggle Allow from this source.
          files: mobile/narendra-kirana.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
