name: Build Customer Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK to GitHub Releases (latest)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: 📥 Install Dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild (Generate Native Android)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: 🐘 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Compile Android Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ✍️ Sign APK with Persistent Keystore
        working-directory: mobile
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build tools at: $BUILD_TOOLS_DIR"
          
          # Find output apk
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $RAW_APK"
          
          # Zipalign
          $BUILD_TOOLS_DIR/zipalign -f -p 4 "$RAW_APK" aligned-app.apk
          
          # Sign with permanent keystore (v1, v2, and v3 signatures)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks credentials/release.keystore \
            --ks-pass pass:narendrakirana123 \
            --ks-key-alias narendrakirana \
            --key-pass pass:narendrakirana123 \
            --out smart-kirana.apk \
            aligned-app.apk
            
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify -v smart-kirana.apk
          
          echo "Signed APK created successfully: $(ls -lh smart-kirana.apk)"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-kirana-apk
          path: mobile/smart-kirana.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases (latest)
        if: github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Narendra Kirana Customer App (Latest APK)
          body: |
            ## 📱 Narendra Kirana Mobile App - Official APK
            
            This is the latest production build of the **Narendra Kirana** Android mobile app.
            
            - **Package**: `com.narendrakirana.app`
            - **Direct Download**: [smart-kirana.apk](https://github.com/${{ github.repository }}/releases/latest/download/smart-kirana.apk)
            - **In-App Updater Compatible**: Yes (signed with permanent keystore)
            
            ### How to Install:
            1. Download `smart-kirana.apk` to your phone.
            2. Tap the downloaded file and choose **Install**.
            3. If prompted, tap **Settings** and toggle **Allow from this source**.
          files: mobile/smart-kirana.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
