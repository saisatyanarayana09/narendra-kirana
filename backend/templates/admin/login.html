<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Narendra Kirana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 min-h-screen flex">
    <!-- Left Side: Form -->
    <div class="flex-1 flex items-center justify-center p-8 lg:p-12 bg-white">
        <div class="w-full max-w-md">
            <div class="text-center mb-10 lg:text-left">
                <p class="text-sm font-black tracking-widest uppercase drop-shadow-sm mb-3 flex items-center justify-center lg:justify-start gap-2 text-indigo-600">
                    NARENDRA KIRANA
                </p>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Admin Vault</h1>
                <p class="text-base text-slate-500 mt-2 font-medium">Restricted Access. Authorized personnel only.</p>
            </div>
            
            <form method="post" action="{% url 'admin:login' %}" class="space-y-6">
                {% csrf_token %}
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Username</label>
                        <input type="text" name="username" required autofocus
                            class="w-full rounded-xl border border-slate-200 px-4 py-3.5 bg-slate-50 outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all shadow-sm" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">Password</label>
                        <input type="password" name="password" required 
                            class="w-full rounded-xl border border-slate-200 px-4 py-3.5 bg-slate-50 outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all shadow-sm" />
                    </div>
                </div>

                <button type="submit" 
                    class="w-full rounded-xl bg-slate-900 px-4 py-3.5 font-bold text-white hover:bg-black transition-all shadow-lg flex items-center justify-center">
                    Log in with Password
                </button>
            </form>

            <div class="relative flex items-center justify-center my-6">
                <span class="absolute bg-white px-3 text-[11px] font-black uppercase tracking-widest text-slate-400">or use secure token</span>
                <div class="w-full border-t border-slate-200"></div>
            </div>
            
            <div id="g_id_onload"
                 data-client_id=""
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            
            <!-- Standard Google Button -->
            <div class="flex justify-center w-full mb-4">
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     data-width="400">
                </div>
            </div>
            
            <!-- Custom Styled Fallback Google Button (submits to the same backend) -->
            <form method="POST" action="/api/v1/auth/admin-google-login/" id="customGoogleForm">
               <input type="hidden" name="credential" id="custom_credential_input">
            </form>

        </div>
    </div>
    
    <!-- Right Side: Image -->
    <div class="hidden lg:block lg:flex-1 relative overflow-hidden bg-slate-900">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/80 to-black/90 z-10 mix-blend-multiply"></div>
        <img src="https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?auto=format&fit=crop&q=80&w=1920" 
            alt="Server vault" 
            class="absolute inset-0 w-full h-full object-cover grayscale opacity-50 scale-105" />
        <div class="absolute bottom-0 left-0 p-16 z-20 w-full max-w-2xl">
            <h2 class="text-4xl font-extrabold text-white mb-4 tracking-tight leading-tight">
                Secure Database <br/>Access Portal.
            </h2>
            <p class="text-indigo-200 text-lg leading-relaxed font-medium">
                This is a restricted administrative zone. All actions are logged and monitored.
            </p>
        </div>
    </div>
    
    <script>
        // Set the actual client ID
        const clientId = "729937153109-6e8fivp20b3ri2qsah1d6u2a7oi0uls6.apps.googleusercontent.com";
        document.getElementById('g_id_onload').setAttribute('data-client_id', clientId);

        function handleCredentialResponse(response) {
            document.getElementById('custom_credential_input').value = response.credential;
            document.getElementById('customGoogleForm').submit();
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'mb-6 p-4 rounded-xl bg-red-50 text-sm font-bold text-red-700 border border-red-100';
            errorDiv.innerText = 'Login Failed: ' + error.replace(/_/g, ' ');
            document.querySelector('form').before(errorDiv);
        }
    </script>
</body>
</html>
