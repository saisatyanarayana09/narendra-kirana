<!doctype html>
<html lang="en">
 <head>
 <meta charset="UTF-8"/>
 <link rel="icon" type="image/jpeg" href="/favicon.jpg"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="preconnect" href="https://narendra-kirana.onrender.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
 <title>Narendra Kirana</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sk_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#090d16');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
 </head>
 <body class="bg-slate-50 dark:bg-[#090d16] text-slate-900 dark:text-slate-100 font-sans antialiased tracking-tight" style="-webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">
 <div id="root"></div>
 <script type="module" src="/src/main.jsx"></script>
 </body>
</html>
